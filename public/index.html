  <!-- =====================================================
       MATHJAX
       Permet d'afficher correctement les mathématiques
       ===================================================== -->

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ['\\(', '\\)']
        ],
        displayMath: [
          ['\\[', '\\]']
        ],
        processEscapes: true
      },

      options: {
        skipHtmlTags: [
          'script',
          'noscript',
          'style',
          'textarea',
          'pre',
          'code'
        ]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
