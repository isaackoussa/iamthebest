[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/progress"
  to = "/.netlify/functions/progress"
  status = 200
  force = true

[[redirects]]
  from = "/api/ask-ai"
  to = "/.netlify/functions/ask-ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/generate-exercise"
  to = "/.netlify/functions/generate-exercise"
  status = 200
  force = true

[[redirects]]
  from = "/api/translate"
  to = "/.netlify/functions/translate"
  status = 200
  force = true
